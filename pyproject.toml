[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent"
version = "0.8.14"
description = "The self-improving AI agent — creates skills from experience, improves them during use, and runs anywhere"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nous Research" }]
license = { text = "MIT" }
dependencies = [
  # Core — pinned to known-good ranges to limit supply chain attack surface
  "openai==2.33.0",
  "anthropic==0.97.0",
  "python-dotenv==1.2.2",
  "fire==0.7.1",
  "httpx==0.28.1",
  "rich==14.3.4",
  "tenacity==9.1.4",
  "pyyaml==6.0.3",
  "requests==2.33.1",
  "jinja2==3.1.6",
  "pydantic==2.13.3",
   # Interactive CLI (prompt_toolkit is used directly by cli.py)
  "prompt_toolkit==3.0.52",
   # Tools
  "exa-py==2.12.1",
  "firecrawl-py==4.23.1",
  "parallel-web==0.5.1",
  "fal-client==0.14.1",
  # Text-to-speech (Edge TTS is free, no API key needed)
  "edge-tts==7.2.8",
  # Skills Hub (GitHub App JWT auth — optional, only needed for bot identity)
  "PyJWT[crypto]==2.12.1",
  "croniter==6.2.2"
]

[project.optional-dependencies]
modal = ["modal==1.4.2"]
daytona = ["daytona==0.171.0"]

messaging = [
  "python-telegram-bot[webhooks]==22.7",
  "discord.py[voice]==2.7.1",
  "aiohttp==3.13.5",
  "slack-bolt==1.28.0",
  "slack-sdk==3.41.0",
]

cron = ["croniter==6.2.2"]

slack = [
  "slack-bolt==1.28.0",
  "slack-sdk==3.41.0",
]

matrix = [
  "matrix-nio[e2e]==0.25.2",
  "Markdown==3.10.2",
]

cli = ["simple-term-menu==1.6.6"]

tts-premium = ["elevenlabs==1.59.0"]

voice = [
  "faster-whisper==1.2.1",
  "sounddevice==0.5.5",
  "numpy==2.4.4",
]

pty = [
  "ptyprocess==0.7.0; sys_platform != 'win32'",
  "pywinpty==2.0.15; sys_platform == 'win32'",
]

honcho = ["honcho-ai==2.1.1"]
mcp = ["mcp==1.27.0"]

homeassistant = [
  "aiohttp==3.13.5",
]

sms = [
  "aiohttp==3.13.5",
]

acp = ["agent-client-protocol==0.9.0"]

dingtalk = ["dingtalk-stream==0.24.3"]

feishu = ["lark-oapi==1.5.5"]

rl = [
  "atroposlib @ git+https://github.com/NousResearch/atropos.git@c20c85256e5a45ad31edf8b7276e9c5ee1995a30",
  "tinker @ git+https://github.com/thinking-machines-lab/tinker.git@30517b667f18a3dfb7ef33fb56cf686d5820ba2b",
  "fastapi==0.136.1",
  "uvicorn[standard]==0.46.0",
  "wandb==0.26.1",
]

yc-bench = [
  "yc-bench @ git+https://github.com/collinear-ai/yc-bench.git@bfb0c88062450f46341bd9a5298903fc2e952a5c ; python_version >= '3.12'",
]

all = [
  "hermes-agent[modal]",
  "hermes-agent[daytona]",
  "hermes-agent[messaging]",
  # matrix excluded: python-olm is upstream-broken on modern macOS.
  "hermes-agent[cron]",
  "hermes-agent[cli]",
  "hermes-agent[dev]",
  "hermes-agent[tts-premium]",
  "hermes-agent[slack]",
  "hermes-agent[pty]",
  "hermes-agent[honcho]",
  "hermes-agent[mcp]",
  "hermes-agent[homeassistant]",
  "hermes-agent[sms]",
  "hermes-agent[acp]",
  "hermes-agent[voice]",
  "hermes-agent[dingtalk]",
  "hermes-agent[feishu]",
]

[project.scripts]
hermes = "hermes_cli.main:main"
hermes-agent = "run_agent:main"
hermes-acp = "acp_adapter.entry:main"

[tool.setuptools]
py-modules = ["run_agent", "model_tools", "toolsets", "batch_runner", "trajectory_compressor", "toolset_distributions", "cli", "hermes_constants", "hermes_state", "hermes_time", "hermes_logging", "rl_cli", "utils"]

[tool.setuptools.packages.find]
include = ["agent", "tools", "tools.*", "hermes_cli", "gateway", "gateway.*", "cron", "acp_adapter", "plugins", "plugins.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
]
addopts = "-m 'not integration' -n auto"
asyncio_mode = "auto"

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-xdist==3.8.0",
  "ruff==0.15.12",
  "debugpy==1.8.20",
  "pytest-asyncio==1.3.0",
  "anyio==4.13.0",
  "httpx==0.28.1",
  "mcp==1.27.0",
  "build==1.5.0",
]

[tool.ruff.lint]
select = ["E", "F", "B"]  # minimal safe set

ignore = [
  "UP006",  # dict vs Dict
  "UP035",  # typing deprecations
  "UP045",  # Optional → |
  "I001",   # import sorting (optional)
  "E501"    # line length
]

[tool.ruff]
line-length = 140
